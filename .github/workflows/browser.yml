name: Browser smoke
on:
  workflow_dispatch:
  schedule:
    - cron: '35 4 * * 1'
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      # This pinned optional test dependency is intentionally outside the zero-dependency core.
      # Add it to the lockfile once a registry-connected environment is available.
      - run: npm install --no-save --package-lock=false @playwright/test@1.65.0
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:browser
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure
          path: test-results/
          retention-days: 14
