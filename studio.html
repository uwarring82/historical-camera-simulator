<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#eeece5"><meta name="description" content="A four-camera photographic workbench with optical finders and film-stock simulation.">
  <link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png"><link rel="stylesheet" href="./studio.css">
  <title>The studio · Camera Archive</title>
</head>
<body>
  <a class="skip" href="#workbench">Skip to instrument</a>
  <header class="mast"><nav aria-label="Studio navigation">
    <a class="brand" href="./index.html"><i aria-hidden="true">◉</i> Camera Archive</a>
    <span class="divider"></span><span class="room">Studio</span>
    <a id="camera-story-link" href="./learn.html?chapter=apollo">Field guide</a>
    <button id="fullscreen" type="button" aria-pressed="false"><span aria-hidden="true">⛶</span> Full screen</button>
  </nav></header>
  <main id="main">
    <div class="instrument-header">
      <div><h1 id="active-camera-name">Apollo 17 Hasselblad</h1><p id="camera-description"></p></div>
      <div id="camera-options" role="group" aria-label="Choose instrument"></div>
    </div>
    <section id="workbench" aria-label="Camera workbench" data-camera="apollo">
      <div class="bench-grid">
        <section class="finder-panel" aria-label="Viewfinder and source">
          <div class="finder-plate">
            <header class="plate-head"><span id="instrument-engraving"></span><span id="frame-label"></span></header>
            <div class="view-room">
              <div class="eyecup"><div id="media-stage">
                <img id="demo-image" src="./demo-scene.jpg" alt="Mountain panorama at Fronalpstock"><video id="live-video" playsinline muted autoplay aria-label="Live camera"></video>
                <canvas id="proof" aria-label="Simulated film preview"></canvas>
                <div id="finder-lines" aria-hidden="true"></div><span id="blind-label" hidden></span>
              </div></div>
            </div>
            <div class="view-foot"><span id="viewport-label">Film preview</span><output id="preview-ev" title="Relative exposure at the film speed"></output></div>
          </div>
          <div class="source-strip" aria-label="Image source">
            <button id="use-demo" type="button">Demo</button><button id="start-camera" type="button">Camera</button>
            <label class="file-btn">Import<input id="import-file" type="file" accept="image/*,.dng" aria-label="Import photo"></label>
            <a id="demo-credit" href="./learn.html?chapter=about#demo-credit" title="Demo photograph and license">Photo credit</a>
            <select id="lens-select" aria-label="Device lens" hidden></select>
          </div>
        </section>
        <section class="controls-panel" aria-labelledby="control-title">
          <header class="controls-head"><h2 id="control-title">Camera controls</h2><span id="mechanical-status"></span></header>
          <div id="mechanical-controls"></div>
          <div class="stock-row">
            <label class="stock-picker">Film stock<select id="film-stock" title="Changing stock loads a fresh roll or magazine"></select></label>
            <div class="film-info"><strong id="iso-value"></strong><span id="grain-info"></span></div>
          </div>
          <div class="model-row">
            <label>Finder<select id="operation-mode"><option value="assisted">Film preview</option><option value="historical">Historical</option></select></label>
            <label>Rendering<select id="render-mode"><option value="evidence">Stock profile</option><option value="creative">Creative</option></select></label>
          </div>
          <div id="adjustments" hidden>
            <label>Grain <output id="grain-value">100%</output><input type="range" id="grain" min="0" max="200" value="100"></label>
            <label>Warmth <output id="warmth-value">0</output><input type="range" id="warmth" min="-50" max="50" value="0"></label>
          </div>
        </section>
      </div>
      <div class="transport">
        <button id="shutter" type="button" aria-label="Expose photograph"><i aria-hidden="true"></i><span>Expose</span></button>
        <div class="report"><span id="shutter-hint"></span><span id="feedback" role="status" aria-live="polite">Demo scene ready.</span></div>
        <button id="review" type="button" disabled><canvas id="photo-canvas" hidden aria-hidden="true"></canvas><span>Last frame</span></button>
        <button id="export" type="button" disabled>Export</button>
      </div>
    </section>
  </main>
  <dialog id="print-dialog"><header><h2 id="print-title">Last frame</h2><button type="button" id="close-print">Close</button></header>
    <p id="print-settings"></p><div id="print-mat"><img id="print-image" alt="Last exposed photograph"></div>
    <button type="button" id="zoom-print" aria-pressed="false">Inspect at 100%</button> <button type="button" id="save-metadata">Save metadata</button></dialog>
  <script type="module" src="./src/app.mjs"></script>
</body></html>
